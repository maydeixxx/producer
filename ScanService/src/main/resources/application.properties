spring.application.name=ScanService
server.port=8083

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.google-search-retrieval=true
spring.ai.google.genai.chat.thinking-level=medium

spring.datasource.url=jdbc:postgresql://localhost:5434/experts_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-version=1