spring.application.name=ScanService
server.port=8083

spring.flyway.enabled=true
spring.flyway.baseline-version=1

ai.api-key=${AI_TOKEN}
ai.base-url=https://openrouter.ai/api/v1/chat/completions
scraper.base-url=https://api.apify.com/v2/acts/apify~instagram-scraper/run-sync-get-dataset-items?token=
scraper.token=${SCRAPER_TOKEN}

spring.datasource.url=jdbc:postgresql://localhost:5434/experts_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

