spring.application.name=TaskService
server.port=${PORT:8081}

spring.flyway.enabled=true
spring.flyway.baseline-version=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:http://localhost:9092}
kafka.topic.tasks-topic=tasksTopic

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tasks_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
