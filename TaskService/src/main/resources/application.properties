spring.application.name=TaskService
server.port=8081

spring.flyway.enabled=true
spring.flyway.baseline-version=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.topic.high-priority=high_priority
kafka.topic.mid-priority=medium_priority
kafka.topic.low-priority=low_priority

spring.datasource.url=jdbc:postgresql://localhost:5432/tasks_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=validate